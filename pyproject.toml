[project]
name = "canvas-connect-mcp"
version = "0.1.0"
description = "MCP server for managing Canvas LMS courses"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
    "canvasapi>=3.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_connect"]
